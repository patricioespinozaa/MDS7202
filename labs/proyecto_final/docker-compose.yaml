services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: chaucherapp-backend:latest # mantener unicamente la ultima version de la imagen
    container_name: chaucherapp-backend
    env_file:
      - .env
    volumes:
      - ./backend:/app
      # Volumen anónimo para /app/.venv, evitando que el bind mount de arriba
      # sobreescriba el entorno virtual ya instalado durante el build de la imagen.
      - /app/.venv
    ports:
      - "8000:8000"
    networks: # conexion a la red interna
      - chaucherapp-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: chaucherapp-frontend:latest # mantener unicamente la ultima version de la imagen
    container_name: chaucherapp-frontend
    env_file:
      - .env
    environment:
      - BACKEND_URL=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/.venv
    ports:
      - "7860:7860"
    depends_on:
      - backend
    networks:  # conexion a la red interna
      - chaucherapp-net

# definicion de la red virtual interna
networks:
  chaucherapp-net:
    driver: bridge
